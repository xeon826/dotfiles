# HDMI-A-1 port is unused. The HDMI switcher (ITE DP2HDMI converter)
# presents itself on DP-2 instead, shared with the Windows PC.
# To restore direct-HDMI later, uncomment the line below and re-cable.
# monitor=HDMI-A-1,4096x2160@119.88,0x-1,2.000000000000001,bitdepth, 10

monitor=DP-1,1920x1080@74.97,8124x0,1.0,bitdepth, 10
monitor=DP-1,transform,3

monitor=DP-2,1920x1080@60.0,4996x0,1.0,bitdepth, 10
monitor=DP-2,transform,1

monitor=DP-3,2560x1440@180.0,6076x0,1.25,bitdepth, 10
