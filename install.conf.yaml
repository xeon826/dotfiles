- defaults:
    link:
      relink: true
      force: true
      create: true

- clean: ['~']

- shell:
    - [git submodule update --init --recursive, Initializing and updating submodules]

- create:
    - ~/.config
    - ~/.local/bin
    - ~/.ncmpcpp
    - ~/.mcphub

- link:
    ~/.config/illogical-impulse/config.json: config.json
    ~/.config/mpDris2: mpDris2
    ~/steam-wayland-wrapper.sh: steam-wayland-wrapper.sh
    ~/.config/fish: fish
    ~/.config/opencode/: opencode
    ~/.config/hypr/hyprland.lua: hyprland.lua
    ~/.config/hypr/custom: hypr-custom
    ~/.config/hypr/hyprland/scripts/workspace_action.sh: hypr-custom/scripts/workspace_action.sh
    ~/.config/alacritty: alacritty.toml
    ~/.config/ranger: ranger
    ~/.bashrc: bashrc
    ~/yt-dlp.conf: yt-dlp.conf
    ~/.bash_profile: bash_profile
    ~/.serena/serena_config.yml: serena_config.yml
    ~/.bash_aliases: bash_aliases
    ~/.xprofile: xprofile
    ~/.vimrc: vimrc
    ~/.config/awesome: awesome-copycats
    ~/.config/mpd: mpd
    ~/.ncmpcpp: ncmpcpp
    ~/.zshrc: .zshrc
    ~/.zprofile: .zprofile
    ~/.config/kitty: kitty
    ~/.config/nvim: nvim
    ~/.config/ksb-nvim: ksb-nvim
    ~/.tmux.conf: tmux.conf
    ~/.local/bin/mkrep: mkrep.py
    ~/.local/bin/helium: helium-wrapper.sh
    ~/.local/share/applications/helium.desktop: helium.desktop
    ~/.local/bin/freetube: freetube/freetube
    ~/.local/bin/freetube-update: freetube/freetube-update
    ~/.local/share/applications/freetube.desktop: freetube/freetube.desktop
    ~/.Xmodmap: Xmodmap
    ~/.config/lazygit/config.yml: lazygit.yml
    ~/.config/systemd/user/everos.service: systemd/everos.service
    ~/.config/systemd/user/gwal.service: systemd/gwal.service
    ~/.config/systemd/user/eos-update-notifier.service: systemd/eos-update-notifier.service
    ~/.config/systemd/user/eos-update-notifier.timer: systemd/eos-update-notifier.timer
    ~/.config/quickshell: quickshell
    ~/.config/mcphub/servers.json: servers.json
    ~/.agent-browser/config.json: agent-browser/config.json
    ~/.gitconfig: gitconfig
    ~/.everos/everos.toml: everos/everos.toml
    ~/.everos/ome.toml: everos/ome.toml
    ~/.inputrc: inputrc

- shell:
    - [./Tokyonight-GTK-Theme/install.sh -d ~/.config/gtk-4.0 -c dark -l, Installing gtk 4.0 theme]

- shell:
    - command: |
        sudo install -m 755 freetube/freetube4-netns.sh /usr/local/sbin/freetube4-netns.sh
        sudo install -m 755 freetube/freetube4-launch /usr/local/sbin/freetube4-launch
        sudo install -m 440 freetube/freetube-netns-sudoers /etc/sudoers.d/freetube-netns
        sudo visudo -cf /etc/sudoers.d/freetube-netns
        sudo install -m 644 freetube/freetube4-netns.service /etc/systemd/system/freetube4-netns.service
        sudo systemctl daemon-reload
        sudo systemctl enable --now freetube4-netns.service
      description: FreeTube IPv4-netns (root scripts, sudoers rule, system unit)
      stdin: true
      stdout: true
