# DavMail gateway for Outlook (M365) — jwilkeson@databank.com
# Symlinked to ~/.config/davmail by dotbot (install.conf.yaml).
davmail.url=https://outlook.office365.com/EWS/Exchange.asmx
davmail.mode=EWS
davmail.server=true
davmail.allowRemote=false

# Listeners (localhost only)
davmail.popPort=1110
davmail.imapPort=1143
davmail.smtpPort=1025
davmail.caldavPort=1080
davmail.ldapPort=1389

# Local clients (Thunderbird) use plain auth; DavMail holds the M365 OAuth token.
davmail.imapAlwaysApproxMsgSize=true
davmail.enableKeepAlive=true
